name: CI

on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ci-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - name: Install workspaced
        run: |
          git clone https://github.com/lucasew/workspaced workspaced-repo
          cd workspaced-repo
          git checkout 4ac19131b55a
          go build -o ../workspaced ./cmd/workspaced
          cd ..
          echo "$PWD" >> $GITHUB_PATH
      - uses: jdx/mise-action@v2
        with:
            install: false
      - run: mise install
      - run: mise run install
      - run: mise run codegen
      - name: Create PR if changes
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update generated code"
          title: "chore: update generated code"
          body: "Automated PR to update generated code."
          branch: "codegen-update"
          base: ${{ github.head_ref || github.ref_name }}
      - run: mise run ci
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} --generate-notes arith.so
